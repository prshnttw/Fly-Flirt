<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06050a">
  <title>{% block title %}Fly//Flirt: what happens when a real fly brain reads your conversation?{% endblock %}</title>
  <meta name="description" content="Chat with a friend or a stranger while a real fruit-fly connectome (166,000 neurons, Janelia MaleCNS) reads your messages. Watch real neurons and synapses fire live, then see which message caused which connection.">
  <meta property="og:title" content="Fly//Flirt">
  <meta property="og:description" content="What happens when a real fly brain reads your conversation?">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%B0%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="{{ url_for('static', filename='js/theme.js') }}?v={{ asset_v }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ asset_v }}">
</head>
<body class="{% block body_class %}{% endblock %}"{% block body_attrs %}{% endblock %}>
<div class="appearance-bar">
  <button class="btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" hidden>
    <span data-theme-icon aria-hidden="true">☀</span><span data-theme-label>Light mode</span>
  </button>
</div>
{% block body %}{% endblock %}
<div id="toasts" aria-live="polite"></div>
<script type="application/json" id="boot">{{ boot|default({})|tojson }}</script>
{% block libs %}{% endblock %}
<script src="{{ url_for('static', filename='js/common.js') }}?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
