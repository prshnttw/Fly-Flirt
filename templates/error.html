{% extends "base.html" %}
{% block title %}{{ title }} · Fly//Flirt{% endblock %}
{% block body %}
<main class="center-page">
  <section class="match-card glass">
    <div style="font-size:3rem">🪰</div>
    <p class="eyebrow" style="margin-top:.4rem">Error {{ status }}</p>
    <h1 class="match-title">{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <div class="row" style="margin-top:1.4rem"><a class="btn btn-primary" href="{{ url_for('pages.landing') }}">← Back home</a></div>
  </section>
</main>
{% endblock %}
